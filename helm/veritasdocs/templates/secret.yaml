apiVersion: v1
kind: Secret
metadata:
  name: {{ include "veritasdocs.fullname" . }}-secrets
  labels:
    {{- include "veritasdocs.labels" . | nindent 4 }}
  annotations:
    # See configmap.yaml — must exist before the pre-install migration Job.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  jwt-secret-key: {{ .Values.secrets.jwtSecretKey | quote }}
  s3-access-key-id: {{ .Values.secrets.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | quote }}
  google-api-key: {{ .Values.secrets.googleApiKey | quote }}
  cohere-api-key: {{ .Values.secrets.cohereApiKey | quote }}
  llamaparse-api-key: {{ .Values.secrets.llamaparseApiKey | quote }}
  minio-root-user: {{ .Values.secrets.s3AccessKeyId | quote }}
  minio-root-password: {{ .Values.secrets.s3SecretAccessKey | quote }}
