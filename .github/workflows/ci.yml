name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docsearch_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes
          pip install -r backend/requirements.txt

      - name: Pyflakes Syntax & Import Check
        run: |
          pyflakes backend/app backend/migrations

      - name: Run Backend Pytest Suite
        env:
          POSTGRES_URL: postgresql+asyncpg://postgres:password@localhost:5432/docsearch_db
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          JWT_SECRET_KEY: testsecretkey12345678901234567890123456789012
        run: |
          cd backend
          pytest tests/
